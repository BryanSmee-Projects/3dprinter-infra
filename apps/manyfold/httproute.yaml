apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manyfold
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold
spec:
  parentRefs:
    # HTTPS is terminated by a reverse proxy in front of this Gateway,
    # so traffic reaching it is plain HTTP.
    # group/kind spelled out explicitly to match the Gateway API defaulting
    # webhook's output — otherwise ArgoCD sees permanent drift against the
    # live object, which has these filled in.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: traefik
  hostnames:
    - manyfold.smee.ovh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service defined in manyfold.yaml. group/kind/weight spelled out for
        # the same reason as parentRefs above.
        - group: ""
          kind: Service
          name: manyfold
          port: 3214
          weight: 1
