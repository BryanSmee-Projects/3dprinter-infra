apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manyfold
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold
spec:
  parentRefs:
    # HTTPS is terminated by a reverse proxy in front of this Gateway,
    # so traffic reaching it is plain HTTP.
    - name: main-gateway
      namespace: traefik
  hostnames:
    - manyfold.smee.ovh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service defined in manyfold.yaml.
        - name: manyfold
          port: 3214
