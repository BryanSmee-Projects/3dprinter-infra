apiVersion: v1
kind: Service
metadata:
  name: manyfold-postgres
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold-postgres
spec:
  selector:
    app.kubernetes.io/name: manyfold-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manyfold-postgres
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold-postgres
spec:
  serviceName: manyfold-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold-postgres
    spec:
      # Avoid Kubernetes service-link env vars (e.g. MANYFOLD_POSTGRES_PORT).
      enableServiceLinks: false
      containers:
        - name: postgres
          # Official image (not Bitnami): runs its entrypoint as root and
          # chowns PGDATA itself, so no fsGroup/FIPS/MD5 problems.
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: manyfold
            - name: POSTGRES_DB
              value: manyfold
            # Subdir keeps PGDATA off the volume root (avoids lost+found, etc).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manyfold-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U manyfold -d manyfold"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U manyfold -d manyfold"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: "longhorn"
