apiVersion: v1
kind: Service
metadata:
  name: manyfold-redis
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold-redis
spec:
  selector:
    app.kubernetes.io/name: manyfold-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold-redis
  namespace: manyfold
  labels:
    app.kubernetes.io/name: manyfold-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          # Cache/queue only — disable persistence so no PVC is needed.
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
