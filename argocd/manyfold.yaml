apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manyfold
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: manyfold
  source:
    # Plain k8s manifests: Manyfold Deployment/Service/PVC, PostgreSQL,
    # Redis, HTTPRoute, and the SealedSecret. No Helm chart — the upstream
    # chart's bundled Bitnami PostgreSQL/Valkey subcharts pulled a
    # subscription-gated, FIPS-hardened `latest` tag that broke md5 auth,
    # so we run everything as plain manifests with official images instead.
    repoURL: https://github.com/BryanSmee-Projects/3dprinter-infra.git
    targetRevision: main
    path: apps/manyfold
  # Kubernetes injects a status field into the StatefulSet's embedded PVC
  # template on the live object (spec.volumeClaimTemplates[].status), which
  # git can never match since it's server-set, not spec — a known
  # StatefulSet/ArgoCD quirk. Ignore it so the app doesn't sit permanently
  # OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: manyfold-postgres
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
